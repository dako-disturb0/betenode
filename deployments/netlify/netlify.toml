[build]
  command = "go build -o functions/lyrics ./api/index.go"
  functions = "functions"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/lyrics"
  status = 200

[build.environment]
  GO_IMPORT_PATH = "github.com/betterlyrics/bete-node"
  MODE = "node"
  UPSTREAM_URL = "https://lyrics.api.dacubeking.com"
